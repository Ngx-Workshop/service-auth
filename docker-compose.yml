services:
  ngx-auth-service:
    build: .
    container_name: ngx-auth-service
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${APP_PRIVATE_IP:?Set approved private application address}:3000:3000"
    env_file: [.env]
    environment:
      NODE_ENV: production
      RUNTIME_PROFILE: production
      LISTEN_HOST: 0.0.0.0
      OAUTH_ENABLED: "true"
      OAUTH_CONFIG_FILE: /run/secrets/oauth.json
      MONGODB_TLS_CA_FILE: /run/secrets/mongo-ca.pem
    volumes:
      - type: bind
        source: ${OAUTH_CONFIG_HOST_FILE:?Set persistent owner-only secret path}
        target: /run/secrets/oauth.json
        read_only: true
      - type: bind
        source: ${MONGODB_TLS_CA_HOST_FILE:?Set verified CA path}
        target: /run/secrets/mongo-ca.pem
        read_only: true
    networks: [ngx-net]
networks:
  ngx-net:
    external: true
