name: Validate, deploy service, and explicitly publish package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package version through trusted OIDC
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install checksum-pinned isolated MongoDB test binary
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/mongo.tgz https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.17.tgz
          echo 'fe7bccea2ac1eed16867e9ae5a60481455ee30796f285fe67d0d02a6c2abbdda  /tmp/mongo.tgz' | sha256sum --check
          mkdir -p /tmp/oauth-test-mongo
          tar -xzf /tmp/mongo.tgz --strip-components=1 -C /tmp/oauth-test-mongo
          echo '/tmp/oauth-test-mongo/bin' >> "$GITHUB_PATH"
      - name: Install and validate auth and additive client
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run test:oauth
          npm run lint:oauth
          npx eslint libs/ngx-auth-client/src/oauth-introspection.ts src/app.module.ts
          npm run lint:oauth:spike
      - name: Build immutable candidate locally (never push)
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag service-auth:candidate .
          docker image inspect service-auth:candidate --format '{{.Id}}' > image-id.txt
          docker run --rm --entrypoint node service-auth:candidate -e 'if(process.getuid() !== 1000) process.exit(1); require("fs").accessSync("dist/src/main.js"); require("bcrypt").hashSync("test-only",4)'
          docker run --rm --entrypoint sh service-auth:candidate -c 'test ! -e /usr/src/app/.oauth-local && test ! -e /usr/src/app/.env && test ! -e /usr/src/app/secrets'
          docker save service-auth:candidate > image.tar
          sha256sum image.tar > image.tar.sha256
      - name: Retain candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: service-auth-candidate-${{ github.sha }}
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: service-auth-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          for name in ("DROPLET_IP", "SSH_PRIVATE_KEY", "SSH_HOST_FINGERPRINT"):
              if not os.environ.get(name):
                  raise SystemExit(f"::error::Missing required deployment secret: {name}")
          PY
      - name: Download the validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: service-auth-candidate-${{ github.sha }}
          path: candidate
      - name: Verify and stage promotion helper
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check image.tar.sha256
          cp ../scripts/production/promote-image.py .
      - name: Transfer the validated image
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          version: '1.8.0'
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: candidate/image.tar,candidate/image.tar.sha256,candidate/promote-image.py
          target: /opt/ngx-nestjs-services/ngx-auth-service/deployments/${{ github.sha }}
          strip_components: 1
          overwrite: true
      - name: Promote image with persistent production configuration
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          version: '1.8.2'
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            cd /opt/ngx-nestjs-services/ngx-auth-service/deployments/${{ github.sha }}
            python3 promote-image.py auth "$PWD" '${{ github.sha }}'
            rm -f image.tar image.tar.sha256 promote-image.py

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build the committed release
        run: |
          npm install --global npm@12.1.0
          npm ci
          npm run build:ngx-auth-client
      - name: Publish through trusted OIDC
        working-directory: dist/libs/ngx-auth-client
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --access public --provenance
